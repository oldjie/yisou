name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check public source and privacy capability guards
        run: python3 scripts/security-check.py --staged
      - name: Install pinned Android platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Adapter tests
        run: |
          mkdir -p build/tests
          javac -encoding UTF-8 -d build/tests app/src/main/java/org/nofeed/android/SearchTarget.java tests/SearchTargetTest.java app/src/main/java/org/nofeed/android/TargetOrdering.java tests/TargetOrderingTest.java
          java -cp build/tests org.nofeed.android.SearchTargetTest
          java -cp build/tests org.nofeed.android.TargetOrderingTest
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yisou-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
